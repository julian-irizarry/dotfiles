# ===== Window =====
hide_window_decorations yes
confirm_os_window_close 0
window_padding_width 0

# ===== Appearance =====
background_opacity 0.85
dynamic_background_opacity yes

cursor_trail 1
cursor_trail_decay 0.1 0.3

# Dim inactive panes (matches wezterm inactive_pane_hsb)
inactive_text_alpha 0.6

# ===== Tab bar =====
tab_bar_edge bottom
tab_bar_style custom
tab_bar_min_tabs 2
active_tab_font_style normal
tab_bar_background #000000

# ===== Scrollback =====
scrollback_lines 10000
scrollback_pager_history_size 500
wheel_scroll_min_lines 1

# ===== Misc =====
enable_audio_bell no
enabled_layouts horizontal, stack
linux_display_server auto

# ===== Keymaps =====

# Shift+Enter for zsh autosuggestions (sends CSI u sequence, same as wezterm)
map shift+enter send_text all \x1b[13;2u

# Tabs: relative nav
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab

# Tabs: direct access
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# Tabs: move left/right
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward

# Close tab / pane
map ctrl+shift+w close_window

# Toggle zoom (stack layout)
map ctrl+shift+f toggle_layout stack

# Splits
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current

# Move the active window in the indicated direction
map ctrl+shift+up move_window up
map ctrl+shift+left move_window left
map ctrl+shift+right move_window right
map ctrl+shift+down move_window down

# Opacity toggles
map ctrl+f10 set_background_opacity 1.0
map ctrl+f11 set_background_opacity 0.85
map ctrl+f12 set_background_opacity 0.55

# Fullscreen
map ctrl+shift+n toggle_fullscreen

# Zen mode: fullscreen + hide tab bar (use kitten)
map ctrl+shift+z combine : toggle_fullscreen : goto_layout stack

# ===== KITTY-SCROLLBACK.NVIM =====
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled
action_alias kitty_scrollback_nvim kitten /home/jirizarry/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

map kitty_mod+s kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
# END_KITTY-SCROLLBACK.NVIM

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

font_size 13
# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
